<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Eventos</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 2rem;
            background: #f5f5f5;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { margin-bottom: 2rem; color: #1a1a1a; }
        .form-card, .events-card { 
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 2rem;
        }
        .form-group { margin-bottom: 1rem; }
        label { 
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #333;
        }
        input, textarea, select {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e0e0e0;
            border-radius: 4px;
            font-size: 1rem;
        }
        textarea { min-height: 100px; font-family: inherit; }
        button {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-right: 0.5rem;
        }
        .btn-primary { background: #8b6914; color: white; }
        .btn-primary:hover { background: #c49a3d; }
        .btn-secondary { background: #6c757d; color: white; }
        .btn-danger { background: #dc3545; color: white; }
        .alert {
            padding: 1rem;
            border-radius: 4px;
            margin-bottom: 1rem;
            display: none;
        }
        .alert.show { display: block; }
        .alert-success { background: #d4edda; color: #155724; }
        .alert-error { background: #f8d7da; color: #721c24; }
        .event-item {
            background: #f9f9f9;
            padding: 1.5rem;
            border-radius: 4px;
            margin-bottom: 1rem;
            border-left: 4px solid #c49a3d;
        }
        .event-item.inactive { opacity: 0.6; }
        .event-title { font-size: 1.2rem; font-weight: 600; margin-bottom: 0.5rem; }
        .event-meta { color: #666; margin-bottom: 0.5rem; }
        .event-actions { margin-top: 1rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📅 Admin - Eventos</h1>
        
        <div class="alert alert-success" id="successAlert"></div>
        <div class="alert alert-error" id="errorAlert"></div>
        
        <div class="form-card">
            <h2 id="formTitle">➕ Añadir Evento</h2>
            <form id="eventForm">
                <input type="hidden" id="eventId">
                
                <div class="form-group">
                    <label>Fecha *</label>
                    <input type="text" id="fecha" placeholder="ej: 15 Junio" required>
                </div>
                
                <div class="form-group">
                    <label>Año *</label>
                    <input type="text" id="año" placeholder="2026" required>
                </div>
                
                <div class="form-group">
                    <label>Título *</label>
                    <input type="text" id="titulo" placeholder="ej: Presentación en Barcelona" required>
                </div>
                
                <div class="form-group">
                    <label>Lugar *</label>
                    <input type="text" id="lugar" placeholder="ej: Ateneo Barcelonés" required>
                </div>
                
                <div class="form-group">
                    <label>Descripción *</label>
                    <textarea id="descripcion" placeholder="Detalles del evento..." required></textarea>
                </div>
                
                <div class="form-group">
                    <label>Orden *</label>
                    <input type="number" id="orden" placeholder="1" value="1" min="1" required>
                </div>
                
                <div class="form-group">
                    <label>Estado</label>
                    <select id="activo">
                        <option value="true">✅ Activo</option>
                        <option value="false">❌ Inactivo</option>
                    </select>
                </div>
                
                <button type="submit" class="btn-primary" id="submitBtn">Guardar</button>
                <button type="button" class="btn-secondary" onclick="resetForm()" id="cancelBtn" style="display:none;">Cancelar</button>
            </form>
        </div>
        
        <div class="events-card">
            <h2>📋 Eventos</h2>
            <div id="loading">Cargando...</div>
            <div id="eventsList"></div>
        </div>
    </div>

    <script>
        // Credenciales directas (la anon key es pública, es seguro)
        const SUPABASE_URL = 'https://ktklvnhowupxyyqwghtf.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt0a2x2bmhvd3VweHl5cXdnaHRmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzNTU5MjAsImV4cCI6MjA5NDkzMTkyMH0.4aUdtuXkU78sSX0PX_yLm9GVsoSoJ2iKmhqs3af4MHI';
        
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let editingId = null;

        // Cargar eventos
        async function loadEvents() {
            try {
                const { data, error } = await supabase
                    .from('eventos')
                    .select('*')
                    .order('orden', { ascending: true });

                if (error) throw error;

                const list = document.getElementById('eventsList');
                document.getElementById('loading').style.display = 'none';

                if (!data || data.length === 0) {
                    list.innerHTML = '<p>No hay eventos</p>';
                    return;
                }

                list.innerHTML = data.map(e => `
                    <div class="event-item ${e.activo ? '' : 'inactive'}">
                        <div class="event-title">${e.titulo}</div>
                        <div class="event-meta">📅 ${e.fecha}, ${e.año} | 📍 ${e.lugar} | Orden: ${e.orden}</div>
                        <div class="event-meta">${e.descripcion}</div>
                        <div class="event-meta">${e.activo ? '✅ Activo' : '❌ Inactivo'}</div>
                        <div class="event-actions">
                            <button class="btn-primary" onclick="editEvent(${e.id})">Editar</button>
                            <button class="btn-secondary" onclick="toggleActive(${e.id}, ${!e.activo})">${e.activo ? 'Ocultar' : 'Mostrar'}</button>
                            <button class="btn-danger" onclick="deleteEvent(${e.id})">Eliminar</button>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                showError('Error: ' + error.message);
            }
        }

        // Guardar evento
        document.getElementById('eventForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const data = {
                fecha: document.getElementById('fecha').value,
                año: document.getElementById('año').value,
                titulo: document.getElementById('titulo').value,
                lugar: document.getElementById('lugar').value,
                descripcion: document.getElementById('descripcion').value,
                orden: parseInt(document.getElementById('orden').value),
                activo: document.getElementById('activo').value === 'true'
            };

            try {
                if (editingId) {
                    const { error } = await supabaseClient.from('eventos').update(data).eq('id', editingId);
                    if (error) throw error;
                    showSuccess('✅ Evento actualizado');
                } else {
                    const { error } = await supabaseClient.from('eventos').insert([data]);
                    if (error) throw error;
                    showSuccess('✅ Evento añadido');
                }
                
                resetForm();
                loadEvents();
            } catch (error) {
                showError('Error: ' + error.message);
            }
        });

        // Editar
        async function editEvent(id) {
            try {
                const { data, error } = await supabaseClient.from('eventos').select('*').eq('id', id).single();
                if (error) throw error;

                editingId = id;
                document.getElementById('fecha').value = data.fecha;
                document.getElementById('año').value = data.año;
                document.getElementById('titulo').value = data.titulo;
                document.getElementById('lugar').value = data.lugar;
                document.getElementById('descripcion').value = data.descripcion;
                document.getElementById('orden').value = data.orden;
                document.getElementById('activo').value = data.activo.toString();
                
                document.getElementById('formTitle').textContent = '✏️ Editar Evento';
                document.getElementById('cancelBtn').style.display = 'inline-block';
                window.scrollTo(0, 0);
            } catch (error) {
                showError('Error: ' + error.message);
            }
        }

        // Toggle activo
        async function toggleActive(id, newState) {
            try {
                const { error } = await supabaseClient.from('eventos').update({ activo: newState }).eq('id', id);
                if (error) throw error;
                showSuccess(newState ? '✅ Activado' : '❌ Desactivado');
                loadEvents();
            } catch (error) {
                showError('Error: ' + error.message);
            }
        }

        // Eliminar
        async function deleteEvent(id) {
            if (!confirm('¿Eliminar este evento?')) return;
            
            try {
                const { error } = await supabaseClient.from('eventos').delete().eq('id', id);
                if (error) throw error;
                showSuccess('🗑️ Evento eliminado');
                loadEvents();
            } catch (error) {
                showError('Error: ' + error.message);
            }
        }

        // Reset form
        function resetForm() {
            document.getElementById('eventForm').reset();
            document.getElementById('orden').value = 1;
            editingId = null;
            document.getElementById('formTitle').textContent = '➕ Añadir Evento';
            document.getElementById('cancelBtn').style.display = 'none';
        }

        // Alertas
        function showSuccess(msg) {
            const el = document.getElementById('successAlert');
            el.textContent = msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 3000);
        }

        function showError(msg) {
            const el = document.getElementById('errorAlert');
            el.textContent = msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 5000);
        }

        // Cargar al inicio
        loadEvents();
    </script>
</body>
</html>
